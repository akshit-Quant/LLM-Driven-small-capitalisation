# vLLM server for the Mistral-7B-Instruct sentiment backend.
#
# Usage:
#   docker compose -f llm-serve/mistral_7b_instruct.yaml up -d
#   docker compose -f llm-serve/mistral_7b_instruct.yaml logs -f
#   docker compose -f llm-serve/mistral_7b_instruct.yaml down
#
# Tyche configuration:
#   TYCHE_SENTIMENT_MISTRAL_BASE_URL=http://localhost:8001/v1
#   TYCHE_SENTIMENT_MISTRAL_MODEL=mistral-7b-instruct

services:
  mistral_7b_instruct:
    image: vllm/vllm-openai:latest
    container_name: tyche-sentiment-mistral

    ports:
      - "8001:8000"

    volumes:
      - hf-cache:/root/.cache/huggingface
      # The AWQ repo has no tokenizer chat_template; vLLM needs one for chat.
      - ../docker/chat-templates:/chat-templates:ro

    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

    command:
      - "${MISTRAL_MODEL:-TheBloke/Mistral-7B-Instruct-v0.2-AWQ}"
      - "--served-model-name=mistral-7b-instruct"
      - "--chat-template=/chat-templates/mistral-instruct.jinja"
      - "--quantization=awq"
      - "--dtype=bfloat16"
      - "--gpu-memory-utilization=${MISTRAL_GPU_MEMORY_UTILIZATION:-0.45}"
      - "--max-num-seqs=32"
      - "--max-model-len=8192"
      - "--host=0.0.0.0"
      - "--port=8000"
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${MISTRAL_GPU_DEVICE:-0}"
              capabilities:
                - gpu

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >
          import urllib.request as u;
          u.urlopen("http://localhost:8000/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  hf-cache:
